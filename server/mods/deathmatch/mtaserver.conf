<config>
    <servername>San Andreas RPG</servername>
    <serverip></serverip>
    <serverport>22003</serverport>
    <httpport>22005</httpport>
    <maxplayers>100</maxplayers>
    <httpdownload>1</httpdownload>
    <httpmaxconnectionsperclient>5</httpmaxconnectionsperclient>
    <httpmaxclientconnections>50</httpmaxclientconnections>
    <httpdosthreshold>20</httpdosthreshold>
    <httpdosbantime>9999</httpdosbantime>
    <httpdosloginterval>10000</httpdosloginterval>
    <password></password>
    <fpslimit>36</fpslimit>
    <voice>0</voice>
    <voicesamplerate>0</voicesamplerate>
    <voicequality>0</voicequality>
    <voicemaxplayers>0</voicemaxplayers>
    <ase>0</ase>
    <chatbox>1</chatbox>
    <shownetc>0</shownetc>
    <donotbroadcastlan>0</donotbroadcastlan>
    <minclientversion></minclientversion>
    <recommendedclientversion></recommendedclientversion>
    <minclientversion_auto_update>0</minclientversion_auto_update>

    <!-- BAZA DANYCH MySQL/MariaDB -->
    <!-- Zmień host, dbname, username, password na swoje dane -->
    <dbhost>127.0.0.1</dbhost>
    <dbport>3306</dbport>
    <dbname>sarpg</dbname>
    <dbuser>sarpg_user</dbuser>
    <dbpass>CHANGE_ME_PASSWORD</dbpass>

    <!-- Zasoby startowane automatycznie (tylko bootstrap) -->
    <resource src="rp_bootstrap" startup="1" protected="0"/>
</config>
